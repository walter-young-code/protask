server:
  port: 8000

spring:
  application:
    name: protask-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境通过 PROTASK_DB_URL / PROTASK_DB_USER / PROTASK_DB_PASSWORD 注入，切勿提交真实凭据
    url: ${PROTASK_DB_URL:jdbc:mysql://localhost:3306/protask?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PROTASK_DB_USER:root}
    password: ${PROTASK_DB_PASSWORD:root}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  # 国际化：消息文件位于 i18n/messages*.properties，默认中文，
  # Accept-Language 请求头为 en 时返回英文
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  servlet:
    multipart:
      # 单文件上限（默认 20MB，可用 PROTASK_MAX_FILE_SIZE 覆盖）；前端预校验值经 /api/v1/site/settings 下发
      max-file-size: ${PROTASK_MAX_FILE_SIZE:20MB}
      # 预留批量上传余量（当前前端串行单文件上传）
      max-request-size: ${PROTASK_MAX_REQUEST_SIZE:50MB}
  mvc:
    locale: zh_CN

protask:
  # 统一时区：JVM 默认时区来源，所有时间戳按此时区产生与存储（跨时区一致性要求固定为 UTC）
  timezone: UTC
  # 首次启动初始化管理员账号的密码；留空则随机生成并仅在首次启动日志中打印一次
  admin:
    initial-password: ${PROTASK_ADMIN_PASSWORD:}
  # 图片上传目录（相对服务运行目录），静态映射到 /api/v1/upload/files/**，公开访问
  upload-dir: uploads
  # 非图片附件私有存储目录（不做静态映射，仅通过鉴权下载接口访问）
  attachment-dir: uploads-attachments
  # 任务附件数量配额（<=0 表示不限制）：单任务默认限 20 个，防止单任务无限堆积
  attachment:
    max-per-task: 20
    max-per-project: 0
    max-per-user-per-day: 0
  # 存储巡检：定时统计两个存储目录并超阈值告警；孤儿图片检测与清理默认关闭，仅开关打开后可手动触发
  storage:
    # 存储后端：local=本地磁盘（开发默认），oss=阿里云 OSS（生产）
    backend: ${PROTASK_STORAGE_BACKEND:local}
    # 巡检 cron（默认每天 03:00）
    check-cron: "${PROTASK_STORAGE_CHECK_CRON:0 0 3 * * *}"
    # 文件数告警阈值（两桶合计）
    warn-file-count: 50000
    # 总占用告警阈值（字节，默认 5GB）
    warn-total-bytes: 5368709120
    # 无引用图片保留天数（上传未满该天数的图片不清理）
    orphan-retention-days: 7
    # 孤儿图片检测与清理：默认关闭。判定需全表扫描文本字段并逐张查询对象大小
    # （OSS 模式下每张一次 HeadObject），且清理不可逆，需要时经环境变量临时开启
    orphan-check-enabled: ${PROTASK_STORAGE_ORPHAN_CHECK:false}
    # 阿里云 OSS（backend=oss 时必填项由 FileStorageConfig 启动校验，缺失即启动失败）
    oss:
      # 同地域 ECS 用内网域名 oss-cn-xxx-internal.aliyuncs.com，不产生公网流量费
      endpoint: ${PROTASK_OSS_ENDPOINT:}
      # 建议使用仅授权这两个桶的 RAM 子账号 AK
      access-key-id: ${PROTASK_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${PROTASK_OSS_ACCESS_KEY_SECRET:}
      public-bucket: ${PROTASK_OSS_PUBLIC_BUCKET:}
      private-bucket: ${PROTASK_OSS_PRIVATE_BUCKET:}
      # 对象 key 前缀：DB 存的 stored_name 是前缀之后的相对路径，上线后不要更改
      public-prefix: ${PROTASK_OSS_PUBLIC_PREFIX:uploads/}
      private-prefix: ${PROTASK_OSS_PRIVATE_PREFIX:attachments/}
  auth:
    # 认证接口限流：单 IP 每分钟最大次数，<=0 关闭限流
    rate-limit:
      login: 10
      register: 5
      # 是否信任反向代理追加的 X-Forwarded-For：nginx 部署时开启，直连部署保持 false 防伪造绕过
      trust-proxy: ${PROTASK_RATE_LIMIT_TRUST_PROXY:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

sa-token:
  # 请求头中 token 的名称
  token-name: Authorization
  # token 有效期（秒），30 天
  timeout: 2592000
  # token 最低活跃频率（秒），-1 表示不限制
  active-timeout: -1
  # 是否允许同一账号多地并发登录
  is-concurrent: true
  # 多次登录是否共用同一个 token
  is-share: true
  # 只从请求头读取 token，不从 cookie 读取
  is-read-header: true
  # 不再从请求参数读取 token（附件下载改为请求头鉴权，避免 token 进入 URL 与日志）
  is-read-body: false
  is-read-cookie: false
  # 请求头 token 前缀，前端传 "Bearer xxx"
  token-prefix: Bearer
  # JWT 签名密钥（生产环境必须通过 PROTASK_JWT_SECRET 环境变量注入，默认值仅限本地开发）
  jwt-secret-key: ${PROTASK_JWT_SECRET:protask-dev-jwt-secret-key-2026}
  is-log: false

logging:
  level:
    com.protask: debug
