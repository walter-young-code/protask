# ProTask 子站 nginx 配置：放到 /etc/nginx/conf.d/protask.conf
# 域名：task.cnood.net（DNS 需先加 A/CNAME 记录指向本机公网 IP）
#
# 部署顺序（第 1 步与第 2 步有先后依赖，因为证书签发要走 80 端口的 HTTP-01 验证）：
#   1) 先把本文件放到 /etc/nginx/conf.d/，nginx -t && systemctl reload nginx
#      （首次 reload 时 443 块引用的证书还不存在，nginx 会报错；此时可只保留 80 那个 server 块）
#   2) 建验证目录并签证书：
#        mkdir -p /var/www/certbot && chown -R www-data:www-data /var/www/certbot
#        certbot certonly --webroot -w /var/www/certbot -d task.cnood.net
#      已有 *.cnood.net 泛域名证书则跳过，把下面两行 ssl_certificate 指向泛域名证书
#   3) 恢复完整配置：nginx -t && systemctl reload nginx
#
# 与现有站点的关系：本文件只按 server_name 匹配 task.cnood.net，
# 现有 80/443 站点不受影响（nginx 按 SNI + server_name 分发）。
#
# 前端产物：cd webapp && npm run build 后把 dist 同步到 /var/www/protask/dist

# 后端只监听 127.0.0.1:8000，keepalive 复用以降低连接开销
upstream protask_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name task.cnood.net;

    # HTTP-01 验证目录：certbot 续期要用，必须留在 80 端口可访问
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.5 用独立的 http2 指令；旧版本把下面一行改回 listen 443 ssl http2
    http2 on;
    server_name task.cnood.net;

    ssl_certificate     /etc/letsencrypt/live/task.cnood.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/task.cnood.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端产物：cd webapp && npm run build 后同步到该目录
    root /var/www/protask/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，避免发版后用户拿到旧 index 引用已失效的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 产物文件名带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://protask_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 与后端 spring.servlet.multipart.max-request-size（默认 50MB）对齐，
        # 沿用默认 1m/10m 会把大文件上传拦成 413，而前端预校验是按后端上限放行的
        client_max_body_size 51m;
    }

    # 上传的图片：后端从 OSS 流式返回并已带 ETag，这里再加一层代理缓存可省 OSS 请求
    # 需要本地缓存目录（如 /var/cache/nginx/protask_images）后取消注释
    # location /api/v1/upload/files/ {
    #     proxy_pass http://protask_backend;
    #     proxy_set_header Host $host;
    #     proxy_cache protask_images;
    #     proxy_cache_valid 200 7d;
    #     add_header X-Cache $upstream_cache_status;
    # }
}
