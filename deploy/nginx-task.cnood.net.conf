# ProTask 子站 nginx 配置（宝塔面板环境实测版）
# 部署位置：/www/server/panel/vhost/nginx/task.cnood.net.conf
#            （该目录由 /www/server/nginx/conf/nginx.conf 第 96 行 include *.conf 加载）
#
# 与既有站点的关系：只按 server_name task.cnood.net 匹配，不使用 default_server，
# 现有 cnood.net / bt.cnood.net / phpmyadmin / 101.133.132.240 等站点不受影响。
#
# 证书：复用已有的 *.cnood.net 泛域名证书（/www/server/panel/vhost/cert/cnood.net/，
#       SAN 含 *.cnood.net 与 cnood.net）。面板续签该证书后本子站自动跟随；
#       若你在面板里删除了 cnood.net 站点的证书，需要同步改这两行，否则 nginx -t 会失败。
#
# DNS：task.cnood.net 需有 A 记录指向本机公网 IP（部署时该记录尚未生效，见文末说明）。
# 前端产物：cd webapp && npm run build 后同步 dist 到 /var/www/protask/dist
# 后端：systemd 单元 protask.service，只监听 127.0.0.1:8000

upstream protask_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name task.cnood.net;

    # ACME HTTP-01 验证目录留给面板签证书用，其余跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/task.cnood.net;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name task.cnood.net;

    ssl_certificate     /www/server/panel/vhost/cert/cnood.net/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cnood.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ProtaskSSL:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/task.cnood.net.log;
    error_log  /www/wwwlogs/task.cnood.net.error.log;

    root /var/www/protask/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 敏感文件与目录（与面板其它站点的写法一致）
    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env(\.|$)|\.gitignore|\.sql(\.gz)?|docker-compose\.yml|Dockerfile)$ {
        return 404;
    }
    location ~* /(\.git|\.svn|\.vscode|\.idea|\.ssh|node_modules)/ {
        return 404;
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，避免发版后旧 index 引用已失效的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 产物文件名带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://protask_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 与后端 spring.servlet.multipart.max-request-size（默认 50MB）对齐，
        # 沿用默认 1m 会把大文件上传拦成 413
        client_max_body_size 51m;
    }
}

# 部署后置校验（把域名解析到本机后可直接换成正式域名）：
#   curl -sk --resolve task.cnood.net:443:127.0.0.1 https://task.cnood.net/api/v1/site/settings
#   curl -skI --resolve task.cnood.net:443:127.0.0.1 https://task.cnood.net/ | head -5
