services:
  mysql:
    image: mysql:8.0
    container_name: protask-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PROTASK_DB_ROOT_PASSWORD:?PROTASK_DB_ROOT_PASSWORD 必须在 .env 中设置}
      MYSQL_DATABASE: protask
      TZ: UTC
    # 仅通过 Docker 内部网络访问，同时为宿主机本地调试
    # （mvn spring-boot:run）绑定 127.0.0.1:3306，不暴露到公网
    ports:
      - "127.0.0.1:3306:3306"
    expose:
      - "3306"
    volumes:
      - protask-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: protask-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库连接三项均可由 .env 覆盖：默认走 compose 内的 mysql 服务，
      # 宿主机 MySQL 场景把 PROTASK_DB_URL 的主机改成 host.docker.internal（见下方 extra_hosts）
      PROTASK_DB_URL: ${PROTASK_DB_URL:-jdbc:mysql://mysql:3306/protask?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
      PROTASK_DB_USER: ${PROTASK_DB_USER:-root}
      # 密钥与数据库密码必须由 .env 显式注入，禁止使用仓库中的示例默认值
      PROTASK_DB_PASSWORD: ${PROTASK_DB_PASSWORD:?PROTASK_DB_PASSWORD 必须在 .env 中设置（容器 MySQL 场景填成与 PROTASK_DB_ROOT_PASSWORD 相同的值）}
      PROTASK_JWT_SECRET: ${PROTASK_JWT_SECRET:?PROTASK_JWT_SECRET 必须在 .env 中设置（可用 openssl rand -base64 48 生成）}
      # 存储后端与 OSS 参数：backend=oss 时 endpoint/凭证/桶名必填，缺失会在启动阶段直接报错
      PROTASK_STORAGE_BACKEND: ${PROTASK_STORAGE_BACKEND:-local}
      PROTASK_OSS_ENDPOINT: ${PROTASK_OSS_ENDPOINT:-}
      PROTASK_OSS_ACCESS_KEY_ID: ${PROTASK_OSS_ACCESS_KEY_ID:-}
      PROTASK_OSS_ACCESS_KEY_SECRET: ${PROTASK_OSS_ACCESS_KEY_SECRET:-}
      PROTASK_OSS_PUBLIC_BUCKET: ${PROTASK_OSS_PUBLIC_BUCKET:-}
      PROTASK_OSS_PRIVATE_BUCKET: ${PROTASK_OSS_PRIVATE_BUCKET:-}
      PROTASK_OSS_PUBLIC_PREFIX: ${PROTASK_OSS_PUBLIC_PREFIX:-uploads/}
      PROTASK_OSS_PRIVATE_PREFIX: ${PROTASK_OSS_PRIVATE_PREFIX:-attachments/}
      # 孤儿图片检测与清理：默认关闭（判定需全表扫描文本 + 逐张查询对象大小，且清理不可逆）
      PROTASK_STORAGE_ORPHAN_CHECK: ${PROTASK_STORAGE_ORPHAN_CHECK:-false}
      # 请求均经 webapp(nginx) 或宿主机 nginx 反向代理，信任其追加的真实客户端 IP
      PROTASK_RATE_LIMIT_TRUST_PROXY: "true"
      TZ: UTC
    ports:
      # 仅供宿主机 nginx 反代；不对外暴露 8000，避免绕过代理直打后端（伪造 X-Forwarded-For 绕过登录限流）
      - "127.0.0.1:8000:8000"
    volumes:
      - protask-uploads:/app/uploads
      - protask-attachments:/app/uploads-attachments
    extra_hosts:
      # 宿主机 MySQL 场景：容器内用 host.docker.internal 访问宿主机 127.0.0.1:3306
      - "host.docker.internal:host-gateway"

  webapp:
    build: ./webapp
    container_name: protask-webapp
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

  # MCP 服务（stdio 传输）：非常驻服务，由 MCP 客户端通过
  # docker run -i --rm --network protask_default ... protask-mcp 按需拉起。
  # 放在 tools profile 下，默认 docker compose up -d 不会启动它，
  # 仅用于统一构建镜像：docker compose build mcp
  mcp:
    build: ./mcp
    image: protask-mcp
    profiles: ["tools"]
    environment:
      # 容器内通过 compose 内部网络的服务名访问后端
      PROTASK_BASE_URL: http://server:8000
    depends_on:
      - server

volumes:
  protask-mysql-data:
  protask-uploads:
  protask-attachments:
